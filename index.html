
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <title>SavvyPiggy</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4ADE80",
                        "accent": "#2DD4BF",
                        "bg-dark": "#0A0F0D",
                        "surface": "#141C19",
                        "surface-light": "#1E2924",
                    },
                    fontFamily: {
                        "sans": ["Plus Jakarta Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0A0F0D;
            color: #E2E8F0;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        /* Tailwind's forms plugin gives every focused field a blue ring and a
           blue border. The ring is drawn with box-shadow, not outline, so
           turning the outline off never removed it. Zeroing the ring variables
           leaves any real shadow utility on the field intact; the border is
           handled per field by a focus:border-* or border-0 class. */
        input:focus, input:focus-visible,
        textarea:focus, textarea:focus-visible,
        select:focus, select:focus-visible {
            outline: none !important;
            --tw-ring-color: transparent !important;
            --tw-ring-shadow: 0 0 #0000 !important;
            --tw-ring-offset-shadow: 0 0 #0000 !important;
        }
        /* Long digits in a balance read as a phone number to Android, which
           then draws them as a blue link. */
        input:-webkit-autofill, input:-webkit-autofill:focus {
            -webkit-text-fill-color: #FFFFFF;
            transition: background-color 100000s ease-in-out 0s;
        }
        ::selection { background: rgba(74, 222, 128, 0.32); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* No backdrop blur. It used to be here, and on a background this close
           to flat black it was invisible — but the fixed nav bar sits over the
           scrolling page, so every scrolled frame had to resample and reblur
           behind it. Measured on device: swiping the cards went from 89% of
           frames late at 25ms to 14% at 12ms once it came out, and the same
           applied to every list in the app. The panel is simply more opaque
           instead, which looks the same and costs nothing. */
        .glass {
            background: rgba(19, 26, 23, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        .safe-pt { padding-top: env(safe-area-inset-top); }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #4ADE80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
            cursor: pointer;
            /* Centres a 24px thumb on the 6px track used by the sliders. */
            margin-top: -9px;
        }
        /* Hide number input spinners (arrows) */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body class="dark overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
